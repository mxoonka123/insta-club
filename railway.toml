[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m bot.main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Members are stored in SQLite. Attach a Volume in the Railway dashboard
# (mount path /data) and set DB_PATH=/data/instaclub.db — otherwise every
# Redeploy starts from an empty club.
